[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aetherion-discord-bot"
version = "0.2.0"
description = "Aetherion — Grok-powered Discord bot"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  {name = "OniOrii"}
]
keywords = ["discord", "bot", "grok", "xai", "aetherion", "ai", "llm", "chat"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Communications :: Chat",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Framework :: AsyncIO",
]

dependencies = [
    "discord.py>=2.7.0,<3.0",
    "httpx>=0.27.0",
    "rapidfuzz>=3.0.0",
    "openai>=1.30.0",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.4.0",
    "pydub>=0.25.1",
    "structlog>=24.4.0",
    "rich>=13.7.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "python-multipart",
    "PyNaCl>=1.5.0",
    "discord-ext-voice-recv>=0.5.0",
    "websockets>=12.0",
    "yt-dlp>=2026.8.19",
]

[project.urls]
Homepage = "https://github.com/OniOrii/Aetherion-Grok-powered-AI"
Repository = "https://github.com/OniOrii/Aetherion-Grok-powered-AI"
Issues = "https://github.com/OniOrii/Aetherion-Grok-powered-AI/issues"
Documentation = "https://github.com/OniOrii/Aetherion-Grok-powered-AI#readme"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
groksito = "groksito_discord.main:run"
aetherion = "groksito_discord.main:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --tb=short"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
